name: apply-double-lessons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna grafica lezioni doppie
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text()

          old_css = '.lesson{display:grid;grid-template-columns:66px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:19px;padding:12px 13px}'
          new_css = old_css[:-1] + ';min-height:88px}.lesson.double{min-height:176px}'
          if old_css not in s:
              raise SystemExit('CSS lesson non trovato')
          s = s.replace(old_css, new_css, 1)

          old_html = 'function lesson(e){return `<article class="lesson">'
          new_html = 'function lesson(e){return `<article class="lesson${e[3]>1?" double":""}">'
          if old_html not in s:
              raise SystemExit('renderer lesson non trovato')
          s = s.replace(old_html, new_html, 1)
          p.write_text(s)

          sw = Path("sw.js")
          t = sw.read_text()
          t = re.sub(r'orario-3alsa-v\d+', 'orario-3alsa-v8', t, count=1)
          sw.write_text(t)

          Path('.github/workflows/apply-double-lessons.yml').unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Raddoppia altezza lezioni di due moduli"
          git push
